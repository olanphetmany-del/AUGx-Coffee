<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUGUSTX - Cashier POS</title>
    <!-- Google Fonts: Noto Sans Lao -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --blue: #1a365d; --green: #689f38; --red: #ef4444; --orange: #f59e0b; --bg: #f4f6f8; --white: #ffffff; --text: #334155; --border: #e0e0e0; }
        * { font-family: 'Noto Sans Lao', sans-serif, 'Segoe UI', Tahoma; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { height: 100%; }
        body { background-color: var(--bg); margin: 0; padding: 0; color: var(--text); height: 100vh; height: 100dvh; overflow: hidden; touch-action: manipulation; }

        .pos-container { display: flex; width: 100%; height: 100%; }
        .menu-section { flex: 1; min-width: 0; min-height: 0; padding: 10px 14px; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
        .cart-section { width: clamp(300px, 34vw, 400px); flex-shrink: 0; height: 100%; min-height: 0; background: var(--white); border-left: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: -2px 0 10px rgba(0,0,0,0.02); }

        /* ===== HEADER ===== */
        .pos-header { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
        .pos-header h1 { margin: 0; color: var(--blue); font-size: 1.25rem; white-space: nowrap; }

        .top-controls { display: flex; align-items: center; gap: 8px; }
        .top-btn { background: var(--blue); color: white; padding: 7px 12px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 13px; border: none; cursor: pointer; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
        .top-btn.kitchen { background: var(--orange); }

        /* ===== NAV ROW ===== */
        .nav-row { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        .nav-tabs-bar { display: flex; gap: 8px; overflow-x: auto; min-width: 0; flex: 1; }
        .nav-tab-btn { padding: 8px 16px; background: white; border: 1px solid var(--border); border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; color: var(--blue); transition: 0.2s; white-space: nowrap; flex-shrink: 0; }
        .nav-tab-btn.active { background: var(--blue); color: white; border-color: var(--blue); }
        .nav-tab-btn.delivery-tab.active { background: var(--orange); border-color: var(--orange); }

        .order-type-switch { flex-shrink: 0; display: flex; background: var(--blue); border-radius: 6px; overflow: hidden; border: 1px solid var(--blue); }
        .type-btn { background: transparent; color: white; border: none; padding: 8px 12px; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .type-btn.active { background: #0f172a; color: white; }
        .type-divider { width: 1px; background: rgba(255,255,255,0.2); }

        /* ===== CATEGORIES ===== */
        .categories-bar { flex-shrink: 0; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 6px; }
        .cat-btn { padding: 7px 14px; background: white; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; white-space: nowrap; flex-shrink: 0; transition: 0.2s; }
        .cat-btn.active, .cat-btn:hover { background: var(--blue); color: white; border-color: var(--blue); }

        /* ===== MENU GRID ===== */
        .menu-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; align-content: start; overflow-y: auto; padding-bottom: 10px; -webkit-overflow-scrolling: touch; }
        .menu-card { background: url('images/bg.jpg') center/cover no-repeat; border-radius: 10px; padding: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; justify-content: space-between; border: 2px solid transparent; position: relative; }
        .menu-card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.85); border-radius: 8px; z-index: 1; }
        .menu-card > * { position: relative; z-index: 2; }
        .menu-card:hover { transform: translateY(-3px); border-color: var(--green); }
        .menu-card img { width: 100%; height: 85px; object-fit: cover; border-radius: 6px; margin-bottom: 6px; background: #e2e8f0; }
        .menu-name { font-weight: bold; font-size: 13px; margin-bottom: 3px; color: var(--blue); }
        .menu-price { font-size: 12px; color: #64748b; }

        /* ===== CART ===== */
        .cart-header { flex-shrink: 0; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 1.05rem; font-weight: bold; color: var(--blue); display: flex; justify-content: space-between; align-items: center; }
        .cart-items { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }

        .cart-item-card { background: #f8fafc; padding: 10px; border-radius: 10px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
        .cart-item-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-weight: bold; font-size: 14px; color: var(--blue); }
        .cart-item-details { font-size: 12px; color: #64748b; margin-top: 2px; }

        .cart-item-actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed #cbd5e1; padding-top: 6px; }
        .cart-item-controls { display: flex; align-items: center; gap: 8px; }
        .qty-btn { width: 32px; height: 32px; background: #e2e8f0; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .qty-btn:hover { background: #cbd5e1; }

        .edit-cart-btn { background: none; border: none; cursor: pointer; font-size: 16px; color: var(--blue); padding: 4px 8px; border-radius: 4px; }
        .edit-cart-btn:hover { background: #e2e8f0; }

        .cart-item-note-input { width: 100%; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; background: #fff; }

        .cart-footer { flex-shrink: 0; padding: 10px 14px; border-top: 1px solid var(--border); background: #f8fafc; }
        .summary-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; font-size: 13px; }
        .summary-row.total { font-size: 1.15rem; font-weight: bold; color: var(--blue); margin-bottom: 8px; }
        .checkout-btn { width: 100%; padding: 12px; background: var(--green); color: white; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .checkout-btn:hover { background: #558b2f; }

        /* ===== MODAL ===== */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box-large { background: white; padding: 20px; border-radius: 16px; width: 92%; max-width: 650px; max-height: 90vh; max-height: 90dvh; overflow-y: auto; box-sizing: border-box; box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex; gap: 20px; }
        .modal-left { width: 170px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
        .modal-left img { width: 100%; height: 170px; object-fit: cover; border-radius: 12px; border: 1px solid var(--border); background: #e2e8f0; }
        .modal-right { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }

        .receipt-modal-box { background: #fff; width: 90%; max-width: 420px; border-radius: 8px; max-height: 95vh; max-height: 95dvh; overflow-y: auto; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px dashed #cbd5e1; }
        .receipt-header { text-align: center; border-bottom: 2px dashed #333; padding-bottom: 12px; margin-bottom: 12px; }
        .receipt-header img { width: 100%; max-height: 80px; object-fit: contain; margin-bottom: 8px; display: block; }
        .receipt-title { font-size: 1.3rem; font-weight: bold; letter-spacing: 1px; margin: 0; color: #000; }
        .receipt-subtitle { font-size: 0.85rem; font-weight: bold; color: #555; margin-top: 2px; }

        .receipt-meta { font-size: 12px; color: #333; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
        .receipt-items-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 15px; }
        .receipt-items-table th { border-bottom: 1px solid #333; padding-bottom: 5px; text-align: left; }
        .receipt-items-table td { padding: 6px 0; border-bottom: 1px dotted #e2e8f0; vertical-align: top; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 3px; font-weight: bold; font-size: 12px; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 10px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; }

        .receipt-totals { border-top: 1px dashed #333; padding-top: 10px; margin-top: 10px; font-size: 13px; display: flex; flex-direction: column; gap: 5px; }
        .receipt-totals .total-row { display: flex; justify-content: space-between; font-weight: bold; font-size: 15px; color: #000; }

        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px; }
        .btn { padding: 12px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; }
        .btn-green { background: var(--green); }
        .btn-red { background: var(--red); }
        .btn-blue { background: var(--blue); }

        .variant-option-btn { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px 15px; margin-bottom: 8px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .variant-option-btn:hover { border-color: var(--green); background: #f0fdf4; }
        .variant-option-btn.selected { border-color: var(--green); background: #f0fdf4; color: #166534; }
    </style>
</head>
<body>
    <div class="pos-container">
        <div class="menu-section">
            <div class="pos-header">
                <h1>AUGUSTX - POS</h1>
                <div class="top-controls">
                    <a href="kitchen.html" class="top-btn kitchen">👨‍🍳 ไปหน้าจอครัว</a>
                    <a href="admin.html" class="top-btn">⚙️ ไปหน้า Admin</a>
                </div>
            </div>

            <div class="nav-row">
                <div class="nav-tabs-bar" id="nav-tabs-container">
                    <button class="nav-tab-btn active" onclick="switchMainTab('store', this)">Cashier</button>
                </div>
                <div class="order-type-switch">
                    <button class="type-btn active" id="btn-dine-in" onclick="setOrderType('Dine-in', this)">Dine-in</button>
                    <div class="type-divider"></div>
                    <button class="type-btn" id="btn-take-away" onclick="setOrderType('Take away', this)">Take away</button>
                </div>
            </div>

            <div class="categories-bar" id="categories-container">
                <button class="cat-btn active" onclick="filterCategory('ALL', this)">ທຸກເມນູ (All)</button>
            </div>

            <div class="menu-grid" id="menu-grid-container"></div>
        </div>

        <div class="cart-section">
            <div class="cart-header">
                <span>ตะกร้าสินค้า (Cart)</span>
                <button onclick="clearCart()" style="background:none; border:none; color:var(--red); font-size:13px; cursor:pointer; font-weight:bold; padding:6px;">ล้างตะกร้า</button>
            </div>
            <div class="cart-items" id="cart-items-container">
                <div style="text-align:center; color:#94a3b8; margin-top:40px;">ຍັງບໍ່ມີສິນຄ້າໃນตะกร้า</div>
            </div>
            <div class="cart-footer">
                <div class="summary-row">
                    <span>ประเภท: <strong id="cart-type-display" style="color:var(--green);">Dine-in</strong></span>
                    <span>ช่องทาง: <strong id="cart-source-display" style="color:var(--blue);">Cashier (Store)</strong></span>
                </div>
                <div class="summary-row"><span>รวมสินค้า</span><span id="cart-item-count">0 รายการ</span></div>
                <div class="summary-row total"><span>ยอดสุทธิ (Total)</span><span id="cart-total-price">0 ₭</span></div>
                <button class="checkout-btn" onclick="openCheckoutModal()">ชำระเงิน (Checkout)</button>
            </div>
        </div>
    </div>

    <!-- SMART OPTIONS MODAL -->
    <div class="modal-overlay" id="variant-modal">
        <div class="modal-box-large">
            <div class="modal-left">
                <img id="modal-item-img" alt="Item Image">
            </div>
            <div class="modal-right">
                <div>
                    <h2 id="modal-item-title" style="margin: 0 0 15px 0; color: var(--blue); border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; font-size: 1.4rem;">MOCHA</h2>
                    <div id="variants-section" style="margin-bottom: 15px;">
                        <label style="font-weight:bold; font-size:13px; color:var(--blue); margin-bottom:6px; display:block;">Variants (ขนาด / ประเภท)</label>
                        <div id="variant-buttons-container"></div>
                    </div>
                    <div id="modifiers-section" style="margin-bottom: 15px; display: none;">
                        <label style="font-weight:bold; font-size:13px; color:var(--blue); margin-bottom:6px; display:block;">Modifiers (ตัวเลือกเสริม)</label>
                        <div id="modifiers-checkboxes-container" style="display:flex; flex-direction:column; gap:8px;"></div>
                    </div>
                </div>
                <div class="modal-actions" style="border-top: 1px solid #e2e8f0; padding-top: 15px; margin-top: 10px;">
                    <button class="btn btn-red" onclick="closeVariantModal()">ยกเลิก</button>
                    <button id="add-to-cart-confirm-btn" class="btn btn-green" onclick="confirmAddToCartWithOptions()">เพิ่มลงตะกร้า</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CHECKOUT MODAL -->
    <div class="modal-overlay" id="checkout-modal">
        <div class="receipt-modal-box">
            <div class="receipt-header">
                <div class="receipt-title">AUGUSTX</div>
                <div class="receipt-subtitle">HOME COFFEE RECIPE</div>
            </div>

            <div class="receipt-meta">
                <div><strong>วันที่:</strong> <span id="receipt-date">--/--/----</span></div>
                <div><strong>ประเภท:</strong> <span id="receipt-type-text">Dine-in</span></div>
            </div>

            <table class="receipt-items-table">
                <thead><tr><th>รายการ</th><th style="text-align:center;">จำนวน</th><th style="text-align:right;">ราคา</th></tr></thead>
                <tbody id="receipt-items-tbody"></tbody>
            </table>

            <div class="form-group">
                <label>เลือกหมายเลขโต๊ะ (Table)</label>
                <select id="checkout-table-select"><option value="">-- เลือกโต๊ะ --</option></select>
            </div>

            <div class="form-group">
                <label>ประเภทการชำระเงิน</label>
                <select id="payment-method" onchange="handlePaymentMethodChange()">
                    <option value="cash">เงินสด (Cash)</option>
                    <option value="transfer">โอนเงิน QR (BCEL One)</option>
                </select>
            </div>

            <div class="form-group" id="cash-received-group">
                <label>รับเงินมา</label>
                <input type="number" id="cash-received" placeholder="0" oninput="calculateChange()">
            </div>

            <div class="receipt-totals">
                <div style="display:flex; justify-content:space-between;"><span>ยอดรวม:</span> <span id="receipt-subtotal">0 ₭</span></div>
                <div style="display:flex; justify-content:space-between;" id="receipt-change-row"><span>เงินทอน:</span> <span id="receipt-change" style="color:var(--green); font-weight:bold;">0 ₭</span></div>
                <div class="total-row"><span>ยอดสุทธิ:</span> <span id="receipt-grand-total" style="color:var(--red);">0 ₭</span></div>
            </div>

            <div class="modal-actions" style="margin-top:20px;">
                <button class="btn btn-red" onclick="closeCheckoutModal()">ยกเลิก</button>
                <button class="btn btn-blue" onclick="printViaRawBTDirect()" style="background:#0284c7;" title="พิมพ์ตรงผ่านแอป RawBT">🖨️ พิมพ์ผ่าน RawBT</button>
                <button class="btn btn-green" onclick="confirmCheckout()">พิมพ์ปกติ & ส่งครัว</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDAJUEFUwkieMGFxRIZ6vRwzLbXF31c_BM", authDomain: "augx-d75c2.firebaseapp.com", databaseURL: "https://augx-d75c2-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "augx-d75c2", storageBucket: "augx-d75c2.firebasestorage.app" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let globalCategories = [];
        let globalItems = [];
        let globalModifiersMaster = [];
        let globalDeliveryPartners = [];
        let currentCategory = 'ALL';
        let currentOrderSource = 'store';
        let currentOrderType = 'Dine-in';
        let cart = [];
        let activeItemForModal = null;
        let selectedVariantName = '';
        let selectedVariantPrice = 0;
        let editingCartIndex = null;

        database.ref('tables').on('value', snap => {
            let html = '<option value="">-- เลือกโต๊ะ --</option>';
            snap.forEach(child => { let t = child.val(); html += `<option value="${t.name}">${t.name}</option>`; });
            document.getElementById('checkout-table-select').innerHTML = html;
        });

        database.ref('delivery_partners').on('value', snap => {
            globalDeliveryPartners = [];
            snap.forEach(child => { let p = child.val(); p.id = child.key; globalDeliveryPartners.push(p); });
            renderNavTabs();
        });

        function renderNavTabs() {
            let html = `<button class="nav-tab-btn ${currentOrderSource === 'store' ? 'active' : ''}" onclick="switchMainTab('store', this)">Cashier</button>`;
            globalDeliveryPartners.forEach(p => {
                let isActive = currentOrderSource === p.name ? 'active' : '';
                html += `<button class="nav-tab-btn delivery-tab ${isActive}" onclick="switchMainTab('${p.name}', this)">${p.name}</button>`;
            });
            document.getElementById('nav-tabs-container').innerHTML = html;
        }

        function switchMainTab(source, btn) {
            currentOrderSource = source;
            document.querySelectorAll('.nav-tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('cart-source-display').innerText = source === 'store' ? 'Cashier (Store)' : source;
            renderMenuGrid();
        }

        function setOrderType(type, btn) {
            currentOrderType = type;
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('cart-type-display').innerText = type;
        }

        database.ref('categories').on('value', snap => {
            globalCategories = [];
            snap.forEach(child => { let cat = child.val(); cat.id = child.key; globalCategories.push(cat); });
            let html = `<button class="cat-btn ${currentCategory === 'ALL' ? 'active' : ''}" onclick="filterCategory('ALL', this)">ທຸກເມນູ (All)</button>`;
            globalCategories.forEach(c => { html += `<button class="cat-btn ${currentCategory === c.name ? 'active' : ''}" onclick="filterCategory('${c.name}', this)">${c.name}</button>`; });
            document.getElementById('categories-container').innerHTML = html;
        });

        database.ref('modifiers').on('value', snap => {
            globalModifiersMaster = [];
            snap.forEach(child => { let m = child.val(); m.id = child.key; globalModifiersMaster.push(m); });
        });

        database.ref('menu_items').on('value', snap => {
            globalItems = [];
            snap.forEach(child => { let item = child.val(); item.id = child.key; globalItems.push(item); });
            renderMenuGrid();
        });

        function filterCategory(catName, btn) {
            currentCategory = catName;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMenuGrid();
        }

        function renderMenuGrid() {
            let filtered = currentCategory === 'ALL' ? globalItems : globalItems.filter(i => i.category === currentCategory);
            let html = '';
            filtered.forEach(item => {
                let price = Number(item.priceOptions || 0);
                html += `<div class="menu-card" onclick="handleItemClick('${item.id}')"><img src="${item.image || 'images/bg.jpg'}"><div><div class="menu-name">${item.name}</div><div class="menu-price">${price.toLocaleString()} ₭</div></div></div>`;
            });
            document.getElementById('menu-grid-container').innerHTML = html || '<div style="grid-column:1/-1; text-align:center; color:#94a3b8; padding:40px;">ไม่มีสินค้า</div>';
        }

        function handleItemClick(itemId, cartIndex = null) {
            let item = globalItems.find(i => i.id === itemId);
            if(!item) return;
            activeItemForModal = item; editingCartIndex = cartIndex; selectedVariantName = ''; selectedVariantPrice = Number(item.priceOptions || 0);
            document.getElementById('modal-item-title').innerText = item.name;
            document.getElementById('modal-item-img').src = item.image || 'images/bg.jpg';
            document.getElementById('variants-section').style.display = 'none';
            document.getElementById('modifiers-section').style.display = 'none';
            document.getElementById('variant-modal').style.display = 'flex';
        }

        function confirmAddToCartWithOptions() {
            if(!activeItemForModal) return;
            let cartItem = { id: activeItemForModal.id, name: activeItemForModal.name, price: selectedVariantPrice, quantity: 1, note: '' };
            let existing = cart.find(c => c.id === cartItem.id);
            if(existing) existing.quantity++; else cart.push(cartItem);
            renderCart(); closeVariantModal();
        }

        function closeVariantModal() { document.getElementById('variant-modal').style.display = 'none'; activeItemForModal = null; editingCartIndex = null; }
        function updateQty(index, delta) { cart[index].quantity += delta; if(cart[index].quantity <= 0) cart.splice(index, 1); renderCart(); }
        function clearCart() { cart = []; renderCart(); }

        function renderCart() {
            let container = document.getElementById('cart-items-container');
            if(cart.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#94a3b8; margin-top:40px;">ຍັງບໍ່ມີສິນຄ້າໃນตะกร้า</div>';
                document.getElementById('cart-item-count').innerText = '0 รายการ';
                document.getElementById('cart-total-price').innerText = '0 ₭'; return;
            }
            let html = ''; let totalQty = 0; let totalPrice = 0;
            cart.forEach((c, index) => {
                totalQty += c.quantity; let sub = c.price * c.quantity; totalPrice += sub;
                html += `<div class="cart-item-card"><div class="cart-item-top"><div class="cart-item-name">${c.name}</div><div>${c.price.toLocaleString()} ₭</div></div><div style="display:flex; justify-content:space-between; align-items:center;"><span>รวม: ${sub.toLocaleString()} ₭</span><div><button onclick="updateQty(${index}, -1)">-</button> ${c.quantity} <button onclick="updateQty(${index}, 1)">+</button></div></div></div>`;
            });
            container.innerHTML = html;
            document.getElementById('cart-item-count').innerText = totalQty + ' รายการ';
            document.getElementById('cart-total-price').innerText = totalPrice.toLocaleString() + ' ₭';
        }

        function openCheckoutModal() {
            if(cart.length === 0) return alert("ตะกร้าว่างเปล่า!");
            let total = cart.reduce((s, c) => s + (c.price * c.quantity), 0);
            document.getElementById('receipt-date').innerText = new Date().toLocaleString('en-GB');
            document.getElementById('receipt-type-text').innerText = currentOrderType;
            let tbody = '';
            cart.forEach(c => { tbody += `<tr><td>${c.name}</td><td align="center">${c.quantity}</td><td align="right">${(c.price*c.quantity).toLocaleString()} ₭</td></tr>`; });
            document.getElementById('receipt-items-tbody').innerHTML = tbody;
            document.getElementById('receipt-subtotal').innerText = total.toLocaleString() + ' ₭';
            document.getElementById('receipt-grand-total').innerText = total.toLocaleString() + ' ₭';
            document.getElementById('checkout-modal').style.display = 'flex';
        }

        function closeCheckoutModal() { document.getElementById('checkout-modal').style.display = 'none'; }
        function handlePaymentMethodChange() {
            let m = document.getElementById('payment-method').value;
            document.getElementById('cash-received-group').style.display = m === 'cash' ? 'block' : 'none';
        }
        function calculateChange() {
            let total = cart.reduce((s, c) => s + (c.price * c.quantity), 0);
            let rec = parseFloat(document.getElementById('cash-received').value) || 0;
            document.getElementById('receipt-change').innerText = (rec - total >= 0 ? rec - total : 0).toLocaleString() + ' ₭';
        }

        // ฟังก์ชันสั่งพิมพ์ผ่านแอปตัวกลาง RawBT (Direct Print) ตัดปัญหาหาเครื่องพิมพ์ไม่เจอ
        function printViaRawBTDirect() {
            let total = cart.reduce((s, c) => s + (c.price * c.quantity), 0);
            let table = document.getElementById('checkout-table-select').value;
            
            let text = "       AUGUSTX COFFEE\n";
            text += "--------------------------------\n";
            text += "Date: " + new Date().toLocaleString('en-GB') + "\n";
            if(table) text += "Table: " + table + "\n";
            text += "Type: " + currentOrderType + "\n";
            text += "--------------------------------\n";
            cart.forEach(c => {
                text += `${c.name} x${c.quantity}  ${(c.price*c.quantity).toLocaleString()} K\n`;
            });
            text += "--------------------------------\n";
            text += "TOTAL: " + total.toLocaleString() + " K\n";
            text += "================================\n";
            text += "    Thank you for coming!   \n\n\n";

            // ส่งข้อมูลผ่าน Intent ไปยังแอป RawBT
            let encodedText = encodeURI(text);
            window.location.href = "rawbt:data:text/plain;charset=utf-8," + encodedText;
        }

        function confirmCheckout() {
            let total = cart.reduce((s, c) => s + (c.price * c.quantity), 0);
            let table = document.getElementById('checkout-table-select').value;
            database.ref('orders').push({
                customer: table ? 'โต๊ะ: ' + table : 'ทั่วไป',
                table: table,
                items: cart,
                total: total,
                status: 'pending',
                date: new Date().toLocaleDateString('en-GB'),
                timestamp: Date.now()
            }).then(() => {
                window.print();
                alert("บันทึกและส่ง Order สำเร็จ!");
                closeCheckoutModal(); clearCart();
            });
        }
    </script>
</body>
</html>
