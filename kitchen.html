<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUGUSTX - Kitchen Display</title>
    <!-- Google Fonts: Noto Sans Lao -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --blue: #1a365d; --green: #689f38; --red: #ef4444; --orange: #f59e0b; --bg: #f4f6f8; --white: #ffffff; --text: #334155; --border: #e0e0e0; }
        * { font-family: 'Noto Sans Lao', sans-serif, 'Segoe UI', Tahoma; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { height: 100%; }
        body { background-color: var(--bg); margin: 0; padding: 0; color: var(--text); height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

        .kitchen-container { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 15px; }
        
        .kitchen-header { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .kitchen-header h1 { margin: 0; color: var(--blue); font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
        
        .top-btn { background: var(--blue); color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

        /* Order Cards Grid */
        .orders-grid { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; align-content: start; padding-bottom: 15px; -webkit-overflow-scrolling: touch; }
        
        .order-card { background: var(--white); border-radius: 12px; border-top: 6px solid var(--orange); box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; }
        .order-card.completed { border-top-color: var(--green); opacity: 0.6; }

        .order-card-header { padding: 12px 15px; background: #f8fafc; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .order-table-badge { font-weight: bold; font-size: 1.1rem; color: var(--blue); }
        .order-time { font-size: 12px; color: #64748b; }

        .order-card-body { padding: 15px; flex: 1; overflow-y: auto; max-height: 250px; }
        .order-item-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 6px 0; border-bottom: 1px dotted #e2e8f0; font-size: 14px; }
        .order-item-row:last-child { border-bottom: none; }
        .item-name-qty { font-weight: bold; color: var(--text); }
        .item-note { font-size: 12px; color: var(--red); margin-top: 2px; }

        .order-card-footer { padding: 12px 15px; background: #f8fafc; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .order-source-badge { font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 4px; background: #e0f2fe; color: #0369a1; }
        
        .action-btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; color: white; background: var(--green); text-transform: uppercase; }
        .action-btn:hover { background: #558b2f; }
    </style>
</head>
<body>
    <div class="kitchen-container">
        <div class="kitchen-header">
            <h1>👨‍🍳 หน้าจอจัดการออร์เดอร์ห้องครัว (Kitchen Display)</h1>
            <div style="display:flex; gap:10px;">
                <a href="index.html" class="top-btn">🛒 ไปหน้า Cashier</a>
                <a href="admin.html" class="top-btn" style="background:var(--blue);">⚙️ ไปหน้า Admin</a>
            </div>
        </div>

        <div class="orders-grid" id="kitchen-orders-container">
            <div style="grid-column: 1/-1; text-align:center; color:#94a3b8; padding:50px;">กำลังโหลดออร์เดอร์...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDAJUEFUwkieMGFxRIZ6vRwzLbXF31c_BM", authDomain: "augx-d75c2.firebaseapp.com", databaseURL: "https://augx-d75c2-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "augx-d75c2", storageBucket: "augx-d75c2.firebasestorage.app" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();

        database.ref('orders').on('value', snap => {
            let container = document.getElementById('kitchen-orders-container');
            let html = '';
            let orders = [];

            snap.forEach(child => {
                let order = child.val();
                order.id = child.key;
                orders.push(order);
            });

            // เรียงลำดับจากใหม่ไปเก่า
            orders.sort((a, b) => b.timestamp - a.timestamp);

            orders.forEach(order => {
                let isCompleted = order.status === 'completed';
                let itemsHtml = '';
                if(order.items) {
                    order.items.forEach(item => {
                        let details = [item.variant, ...(item.modifiers || []).map(m => m.option)].filter(Boolean).join(' | ');
                        itemsHtml += `<div class="order-item-row"><div><div class="item-name-qty"><b>${item.quantity}x</b> ${item.name} ${details ? '(' + details + ')' : ''}</div>${item.note ? '<div class="item-note">Note: ' + item.note + '</div>' : ''}</div></div>`;
                    });
                }

                html += `<div class="order-card ${isCompleted ? 'completed' : ''}">
                    <div class="order-card-header">
                        <span class="order-table-badge">${order.customer || 'โต๊ะทั่วไป'}</span>
                        <span class="order-time">${order.date || ''}</span>
                    </div>
                    <div class="order-card-body">${itemsHtml}</div>
                    <div class="order-card-footer">
                        <span class="order-source-badge">${order.source || 'Store'} (${order.orderType || 'Dine-in'})</span>
                        <button class="action-btn" style="background:${isCompleted ? '#64748b' : 'var(--green)'}" onclick="toggleOrderStatus('${order.id}', '${order.status}')">${isCompleted ? 'เสร็จแล้ว ✓' : 'เสิร์ฟ / เสร็จสิ้น'}</button>
                    </div>
                </div>`;
            });

            container.innerHTML = html || '<div style="grid-column: 1/-1; text-align:center; color:#94a3b8; padding:50px;">ไม่มีออร์เดอร์ในขณะนี้</div>';
        });

        function toggleOrderStatus(orderId, currentStatus) {
            let newStatus = currentStatus === 'completed' ? 'pending' : 'completed';
            database.ref('orders/' + orderId).update({ status: newStatus });
        }
    </script>
</body>
</html>
